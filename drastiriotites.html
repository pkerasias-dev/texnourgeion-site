<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τεχνουργείον — Δραστηριότητες</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Poppins:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --red:#E24430;
    --red-dark:#B93323;
    --teal:#2E6B57;
    --teal-dark:#1F4A3C;
    --amber:#E8A23A;
    --amber-dark:#B87A22;
    --ink:#231A14;
    --cream:#FFFAF0;
    --cream-2:#FFF1DC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--cream);}
  .display{font-family:'Comfortaa',sans-serif;}
  a{color:inherit;}

  .frame{display:grid;grid-template-columns:250px 1fr;}

  /* Sidebar */
  nav.side{
    background:#fff;
    padding:2rem 1.6rem;
    display:flex;flex-direction:column;
    border-right:1px solid rgba(0,0,0,0.06);
  }
  .logo{display:flex;align-items:center;gap:8px;margin-bottom:2.5rem;}
  .logo-mark{width:34px;height:34px;flex:none;}
  .logo span{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.01em;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:0.35rem;}
  .nav-list a{
    text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500;
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:10px;
  }
  .nav-list a svg{width:18px;height:18px;flex:none;stroke:var(--ink);opacity:0.75;}
  .nav-list a.active{background:var(--cream-2);color:var(--red-dark);}
  .nav-list a.active svg{stroke:var(--red);opacity:1;}
  .side-footer{margin-top:auto;padding-top:2rem;display:flex;gap:10px;}
  .side-footer a{
    width:32px;height:32px;border-radius:50%;background:var(--cream-2);
    display:flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .side-footer svg{width:15px;height:15px;stroke:var(--red-dark);}

  /* Hero */
  .hero{position:relative;padding:3rem 3rem 2rem;overflow:hidden;}
  .hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:2.5rem;align-items:center;position:relative;z-index:2;}
  .eyebrow-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:8px;}
  .hero h1{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:44px;line-height:1.15;letter-spacing:-0.01em;margin:0.6rem 0 1rem;}
  .hero h1 .c1{color:var(--red);}
  .hero h1 .c2{color:var(--teal);}
  .hero p.sub{font-size:16px;color:var(--ink);opacity:0.68;max-width:400px;margin-bottom:1.6rem;line-height:1.6;}
  .cta{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--red);color:#fff;text-decoration:none;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:14.5px;
    padding:0.85rem 1.5rem;border-radius:100px;
  }
  .cta:hover{background:var(--red-dark);}
  .cat-card p{font-family:'Inter',sans-serif;}

  .story h2{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:32px;color:#fff;line-height:1.25;margin-bottom:0.8rem;}
  .story p{color:#FBD9CE;font-size:15px;line-height:1.6;margin-bottom:1.4rem;max-width:440px;}
  .cta-light{
    display:inline-block;background:#fff;color:var(--red-dark);text-decoration:none;
    font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;
    padding:0.8rem 1.4rem;border-radius:100px;
  }

  /* Categories */
  .cats{padding:3.5rem 3rem;}
  .cats-head{margin-bottom:2rem;}
  .cats-head h2{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:28px;}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;}
  .cat-card{
    position:relative;height:190px;border-radius:18px;text-decoration:none;
    overflow:hidden;display:flex;align-items:flex-end;
  }
  .cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cat-card::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(20,10,8,0.82) 0%,rgba(20,10,8,0.15) 55%,transparent 100%);
  }
  .cat-card .label{position:relative;z-index:2;padding:1rem;}
  .cat-card h3{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:16px;color:#fff;margin-bottom:0.2rem;}
  .cat-card p{font-size:12px;color:rgba(255,255,255,0.8);}

  /* Shows */
  .shows{padding:1rem 3rem 4rem;}
  .show-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
  .show-card{background:#fff;border-radius:20px;padding:14px;border:1px solid rgba(0,0,0,0.05);}
  .show-poster{
    height:170px;border-radius:16px;position:relative;
    display:flex;align-items:flex-start;justify-content:flex-start;
    overflow:hidden;
  }
  .show-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .tag{
    margin:10px;background:rgba(255,255,255,0.92);color:var(--ink);
    font-size:11px;font-weight:600;padding:5px 11px;border-radius:100px;
  }
  .show-body{padding:1rem 0.3rem 0.2rem;}
  .show-body h3{font-family:'Comfortaa',sans-serif;font-size:17px;font-weight:700;margin-bottom:0.3rem;}
  .show-body p{font-size:13px;opacity:0.6;}

  /* Footer */
  footer{background:var(--teal-dark);padding:3rem 3rem 2rem;position:relative;overflow:hidden;color:#F2E8DD;}
  .foot-grid{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;position:relative;z-index:2;}
  footer h3{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:21px;margin-bottom:0.4rem;}
  footer p{font-size:13px;opacity:0.75;max-width:280px;line-height:1.6;}
  .foot-socials{display:flex;gap:10px;margin-top:1rem;}
  .foot-socials a{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .foot-socials svg{width:14px;height:14px;stroke:#F2E8DD;}
  .hills{position:absolute;bottom:0;left:0;width:100%;height:60px;z-index:1;}

  @media (max-width:820px){
    .frame{grid-template-columns:1fr;}
    nav.side{flex-direction:row;flex-wrap:wrap;}
    .nav-list{flex-direction:row;flex-wrap:wrap;}
    .side-footer{display:none;}
    .hero-grid,.story-grid{grid-template-columns:1fr;}
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .show-grid{grid-template-columns:1fr;}
    .hero,.story,.cats,.shows,footer{padding-left:1.25rem;padding-right:1.25rem;}
  }

  #preview-toolbar{
    position:sticky;top:0;z-index:9999;
    background:#1a1310;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:10px;font-family:'Inter',sans-serif;font-size:13px;
  }
  #preview-toolbar button{
    background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);
    padding:6px 14px;border-radius:100px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  #preview-toolbar button.active{background:var(--red);border-color:var(--red);}
  #preview-viewport{transition:max-width 0.25s ease;margin:0 auto;}
  #preview-viewport.mobile{max-width:390px;border-left:1px solid #ddd;border-right:1px solid #ddd;}
  #preview-viewport.mobile .frame{grid-template-columns:1fr;}
  #preview-viewport.mobile nav.side{flex-direction:row;flex-wrap:wrap;}
  #preview-viewport.mobile .nav-list{flex-direction:row;flex-wrap:wrap;}
  #preview-viewport.mobile .side-footer{display:none;}
  #preview-viewport.mobile .hero-grid,#preview-viewport.mobile .story-grid{grid-template-columns:1fr;}
  #preview-viewport.mobile .cat-grid{grid-template-columns:repeat(2,1fr);}
  #preview-viewport.mobile .show-grid{grid-template-columns:1fr;}
  #preview-viewport.mobile .hero,#preview-viewport.mobile .story,#preview-viewport.mobile .cats,#preview-viewport.mobile .shows,#preview-viewport.mobile footer{padding-left:1.25rem;padding-right:1.25rem;}


  .page-header{padding:3rem 3rem 2rem;}
  .page-header .eyebrow{font-size:13px;font-weight:600;color:var(--teal-dark);display:flex;align-items:center;gap:8px;margin-bottom:0.6rem;}
  .page-header h1{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:38px;margin-bottom:0.8rem;}
  .page-header p{font-size:16px;color:var(--ink);opacity:0.68;max-width:520px;line-height:1.6;}
  .page-edit-btn{
    display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid rgba(0,0,0,0.12);
    color:var(--red-dark);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:100px;cursor:pointer;margin-top:1rem;
  }
  .page-add-panel{display:none;margin-top:1rem;padding:1rem;background:var(--cream-2);border-radius:14px;max-width:400px;}
  .page-add-panel.open{display:block;}
  .page-add-panel input{width:100%;border-radius:10px;border:1px solid rgba(0,0,0,0.12);padding:9px 10px;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:10px;}
  .page-add-panel button{background:var(--red);color:#fff;border:none;font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;padding:8px 18px;border-radius:100px;cursor:pointer;}

  .space-section{padding:2.5rem 3rem;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;}
  .space-section.reverse .space-photo{order:2;}
  .space-section.reverse .space-text{order:1;}
  .space-photo{position:relative;height:340px;border-radius:20px;overflow:hidden;background:var(--cream-2);}
  .space-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .space-photo.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px dashed rgba(0,0,0,0.15);}
  .space-photo.empty span{font-size:13px;color:var(--ink);opacity:0.5;}
  .space-text{position:relative;}
  .space-text h2{font-family:'Comfortaa',sans-serif;font-weight:700;font-size:26px;margin-bottom:0.9rem;}
  .space-text p{font-size:15px;color:var(--ink);opacity:0.72;line-height:1.7;max-width:420px;}
  .space-divider{height:1px;background:rgba(0,0,0,0.07);margin:0 3rem;}

  .edit-btn{
    position:absolute;top:-2px;right:0;
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid rgba(0,0,0,0.12);color:var(--red-dark);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:100px;cursor:pointer;
  }
  .edit-panel{display:none;margin-top:1rem;padding:1rem;background:var(--cream-2);border-radius:14px;}
  .edit-panel.open{display:block;}
  .edit-panel label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;margin-top:10px;}
  .edit-panel label:first-child{margin-top:0;}
  .edit-panel input[type=file]{display:block;margin-bottom:4px;font-size:13px;}
  .edit-panel input[type=text]{width:100%;border-radius:10px;border:1px solid rgba(0,0,0,0.12);padding:9px 10px;font-family:'Comfortaa',sans-serif;font-size:15px;}
  .edit-panel textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid rgba(0,0,0,0.12);padding:10px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;}
  .edit-panel .btn-row{display:flex;gap:10px;margin-top:12px;align-items:center;}
  .edit-panel .save-btn{background:var(--red);color:#fff;border:none;font-family:'Poppins',sans-serif;font-weight:600;font-size:13.5px;padding:8px 18px;border-radius:100px;cursor:pointer;}
  .edit-panel .delete-btn{background:none;border:1px solid rgba(0,0,0,0.15);color:var(--ink);opacity:0.6;font-family:'Inter',sans-serif;font-size:13px;padding:8px 16px;border-radius:100px;cursor:pointer;}
  .edit-panel .hint{font-size:11.5px;color:var(--ink);opacity:0.55;margin-top:10px;}

  .add-section-wrap{padding:1rem 3rem 4rem;text-align:center;}
  .add-section-btn{background:#fff;border:2px dashed rgba(0,0,0,0.15);color:var(--red-dark);font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;padding:14px 28px;border-radius:16px;cursor:pointer;width:100%;}
  .add-section-btn:hover{background:var(--cream-2);border-color:var(--red);}

  @media (max-width:820px){
    .space-section,.space-section.reverse{grid-template-columns:1fr;}
    .space-section.reverse .space-photo,.space-section.reverse .space-text{order:unset;}
    .page-header,.space-section,.add-section-wrap{padding-left:1.25rem;padding-right:1.25rem;}
    .space-divider{margin:0 1.25rem;}
    .edit-btn{position:static;margin-bottom:0.8rem;}
  }


  .lang-switch{display:flex;gap:6px;margin:0.8rem 0 1.2rem;}
  .flag-btn{
    display:flex;align-items:center;gap:5px;background:var(--cream-2);border:1px solid rgba(0,0,0,0.08);
    border-radius:100px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;color:var(--ink);opacity:0.55;
  }
  .flag-btn.active{opacity:1;background:#fff;border-color:var(--red);color:var(--red-dark);}

  .flag-btn{display:inline-flex;align-items:center;gap:6px;}
  .flag-btn svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,0.1);}

  .admin-only{display:none !important;}
  body.is-admin .admin-only{display:inline-flex !important;}
  body.is-admin .add-section-btn.admin-only,
  body.is-admin .poster-add.admin-only{display:flex !important;}
  #admin-login-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--cream-2);border:1px solid rgba(0,0,0,0.1);
    color:var(--ink);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:100px;cursor:pointer;margin-top:0.6rem;
  }
  #admin-login-btn:hover{background:#fff;}
  body.is-admin #admin-login-btn{display:none;}
  #admin-status{display:none;font-size:12px;color:var(--ink);opacity:0.6;margin-top:0.6rem;align-items:center;gap:8px;}
  body.is-admin #admin-status{display:flex;}
  #admin-status button{background:none;border:none;color:var(--red-dark);font-weight:600;cursor:pointer;font-size:12px;text-decoration:underline;}
</style>

<script>
  function openAdminLogin(){
    if(typeof netlifyIdentity === 'undefined'){
      alert('Το σύστημα σύνδεσης δεν φόρτωσε. Αν έχεις κάποιο ad-blocker ή privacy extension, απενεργοποίησέ το για αυτή τη σελίδα και κάνε ανανέωση.');

    netlifyIdentity.open();
  }
  if(typeof netlifyIdentity !== 'undefined'){
    netlifyIdentity.on('init', function(user){
      if(user){
        document.body.classList.add('is-admin');
        document.getElementById('admin-email').textContent = user.email;
      }
    });
    netlifyIdentity.on('login', function(user){
      document.body.classList.add('is-admin');
      document.getElementById('admin-email').textContent = user.email;
      netlifyIdentity.close();
    });
    netlifyIdentity.on('logout', function(){
      document.body.classList.remove('is-admin');
    });
    netlifyIdentity.init();
  } else {

  }

    var def = DEFAULT_SECTIONS.find(function(s){return s.slug === slug;}) || {slug:slug, title:'Νέα υποενότητα', text:'', img:null, builtin:false};
    var savedTitle = localStorage.getItem('drast_title_' + slug);
    var savedText = localStorage.getItem('drast_text_' + slug);
    var savedImg = localStorage.getItem('drast_img_' + slug);
    return {
      slug: slug,
      title: savedTitle !== null ? savedTitle : def.title,
      text: savedText !== null ? savedText : def.text,
      img: savedImg !== null ? savedImg : def.img,
      builtin: def.builtin !== false
    };
  });
}

function renderSections(){
  var sections = loadSections();
  var html = '';
  sections.forEach(function(s, i){
    var reverse = (i % 2 === 1) ? ' reverse' : '';
    var photoHtml = s.img
      ? '<div class="space-photo" id="photo-' + s.slug + '"><img src="' + s.img + '"></div>'
      : '<div class="space-photo empty" id="photo-' + s.slug + '"><span>Δεν έχει προστεθεί φωτογραφία ακόμα</span></div>';
    var textHtml = s.text ? s.text : 'Πρόσθεσε μια σύντομη περιγραφή για αυτή τη δραστηριότητα.';
    var deleteBtn = s.builtin ? '' : '<button class="delete-btn" onclick="deleteSection(\'' + s.slug + '\')">Διαγραφή ενότητας</button>';
    html += '<div class="space-section' + reverse + '">' +
      photoHtml +
      '<div class="space-text">' +
        '<button class="edit-btn admin-only" onclick="toggleEdit(\'' + s.slug + '\')">✎ Επεξεργασία</button>' +
        '<h2 id="title-display-' + s.slug + '">' + s.title + '</h2>' +
        '<p id="text-display-' + s.slug + '">' + textHtml + '</p>' +
        '<div class="edit-panel" id="panel-' + s.slug + '">' +
          '<label>Τίτλος</label>' +
          '<input type="text" id="titleinput-' + s.slug + '" value="' + s.title.replace(/"/g,'&quot;') + '">' +
          '<label>Φωτογραφία</label>' +
          '<input type="file" accept="image/*" id="file-' + s.slug + '" onchange="previewImage(\'' + s.slug + '\')">' +
          '<label>Κείμενο</label>' +
          '<textarea id="textarea-' + s.slug + '">' + s.text + '</textarea>' +
          '<div class="btn-row">' +
            '<button class="save-btn" onclick="saveSection(\'' + s.slug + '\')">Αποθήκευση</button>' +
            deleteBtn +
          '</div>' +
          '<p class="hint">Δοκιμαστική λειτουργία — αποθηκεύει στον browser σου.</p>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="space-divider"></div>';
  });
  document.getElementById('sections-container').innerHTML = html;
}

function togglePageAdd(){
  document.getElementById('page-add-panel').classList.toggle('open');
}
function setView(mode){
  var vp = document.getElementById('preview-viewport');
  var bd = document.getElementById('btn-desktop');
  var bm = document.getElementById('btn-mobile');
  if(mode === 'mobile'){
    vp.classList.add('mobile'); bm.classList.add('active'); bd.classList.remove('active');
  } else {
    vp.classList.remove('mobile'); bd.classList.add('active'); bm.classList.remove('active');
  }
}
function toggleEdit(slug){
  document.getElementById('panel-' + slug).classList.toggle('open');
}
function previewImage(slug){
  var input = document.getElementById('file-' + slug);
  if(!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    localStorage.setItem('drast_img_' + slug, e.target.result);
    renderSections();
    document.getElementById('panel-' + slug).classList.add('open');
  };
  reader.readAsDataURL(input.files[0]);
}
function saveSection(slug){
  var title = document.getElementById('titleinput-' + slug).value.trim() || 'Νέα υποενότητα';
  var text = document.getElementById('textarea-' + slug).value;
  localStorage.setItem('drast_title_' + slug, title);
  localStorage.setItem('drast_text_' + slug, text);
  renderSections();
}
function deleteSection(slug){
  if(!confirm('Διαγραφή αυτής της υποενότητας;')) return;
  var customList = JSON.parse(localStorage.getItem('drast_custom_slugs') || '[]');
  customList = customList.filter(function(s){return s !== slug;});
  localStorage.setItem('drast_custom_slugs', JSON.stringify(customList));
  localStorage.removeItem('drast_title_' + slug);
  localStorage.removeItem('drast_text_' + slug);
  localStorage.removeItem('drast_img_' + slug);
  renderSections();
}
function addSection(){
  var nameInput = document.getElementById('new-act-name');
  var slug = 'act' + Date.now();
  var customList = JSON.parse(localStorage.getItem('drast_custom_slugs') || '[]');
  customList.push(slug);
  localStorage.setItem('drast_custom_slugs', JSON.stringify(customList));
  if(nameInput && nameInput.value.trim()){
    localStorage.setItem('drast_title_' + slug, nameInput.value.trim());
    nameInput.value = '';
  }
  renderSections();
  toggleEdit(slug);
  document.getElementById('panel-' + slug).scrollIntoView({behavior:'smooth', block:'center'});
}

renderSections();

function setLang(lang){
  var expires = new Date();
  expires.setFullYear(expires.getFullYear() + 1);
  document.cookie = 'googtrans=/el/' + lang + '; expires=' + expires.toUTCString() + '; path=/';
  document.cookie = 'googtrans=/el/' + lang + '; expires=' + expires.toUTCString() + '; path=/; domain=' + window.location.hostname;
  localStorage.setItem('site_lang', lang);
  window.location.reload();
}
function applyLang(){
  var lang = localStorage.getItem('site_lang') || 'el';
  document.querySelectorAll('.flag-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}
document.addEventListener('DOMContentLoaded', applyLang);
</script>

</body>
